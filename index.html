<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Incoming Call…</title>
  <meta name="description" content="Halloween movie night: tell us your favorite scary movie.">
  <style>
    :root {
      --bg: #050505;
      --fg: #f2f2f2;
      --muted: #8a8a8a;
      --blood: #b3001b;
      --blood-bright: #e0102f;
      --answer: #1fbf4f;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      background: radial-gradient(ellipse at center, #141414 0%, var(--bg) 70%);
    }

    main {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.8s ease; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ---------- Ghostface mask ---------- */
    .mask {
      width: min(62vw, 220px);
      height: auto;
      display: block;
      margin: 0 auto 24px;
      filter: drop-shadow(0 0 24px rgba(255, 255, 255, 0.12));
    }
    .ringing .mask { animation: shake 0.5s ease-in-out infinite; }
    .speaking .mask { animation: breathe 2.4s ease-in-out infinite; }

    @keyframes shake {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-3deg); }
      75% { transform: rotate(3deg); }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .caller-label {
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 6px;
    }
    .caller-name {
      font-size: 1.6rem;
      font-weight: 600;
      margin: 0 0 36px;
    }

    /* ---------- Buttons ---------- */
    .answer-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      border: 0;
      border-radius: 999px;
      padding: 18px 32px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      background: var(--answer);
      cursor: pointer;
      box-shadow: 0 0 0 0 rgba(31, 191, 79, 0.6);
      animation: pulse 1.4s infinite;
    }
    .answer-btn svg { width: 22px; height: 22px; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(31, 191, 79, 0.6); }
      70% { box-shadow: 0 0 0 22px rgba(31, 191, 79, 0); }
      100% { box-shadow: 0 0 0 0 rgba(31, 191, 79, 0); }
    }

    /* ---------- Call / question ---------- */
    .timer {
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      margin: 0 0 20px;
    }
    .question {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.5rem, 6vw, 2rem);
      line-height: 1.25;
      color: var(--blood-bright);
      min-height: 2.6em;
      margin: 0 0 28px;
      text-shadow: 0 0 18px rgba(224, 16, 47, 0.35);
    }

    form { display: none; text-align: left; }
    form.visible { display: block; animation: fadeIn 0.8s ease; }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0 0 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      margin: 0 0 18px;
      font-size: 1rem;
      color: var(--fg);
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--blood-bright);
      box-shadow: 0 0 0 3px rgba(224, 16, 47, 0.25);
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      background: var(--blood);
      cursor: pointer;
    }
    .submit-btn:hover { background: var(--blood-bright); }
    .submit-btn:disabled { opacity: 0.6; cursor: wait; }

    .error {
      color: var(--blood-bright);
      font-size: 0.9rem;
      min-height: 1.2em;
      margin: 12px 0 0;
    }

    /* Hidden honeypot field to catch spam bots */
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

    .end-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.8rem;
      color: var(--blood-bright);
      margin: 0 0 12px;
    }
    .end-sub { color: var(--muted); margin: 0; line-height: 1.5; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <!-- Ghostface mask (shared across screens) -->
    <svg class="mask" viewBox="0 0 200 280" aria-hidden="true">
      <defs>
        <radialGradient id="face" cx="50%" cy="40%" r="65%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="75%" stop-color="#e6e6e6"/>
          <stop offset="100%" stop-color="#bdbdbd"/>
        </radialGradient>
      </defs>
      <!-- black hood -->
      <path d="M100 4 C30 4 4 70 6 140 C8 210 40 276 100 276 C160 276 192 210 194 140 C196 70 170 4 100 4 Z" fill="#0b0b0b" stroke="#1d1d1d" stroke-width="2"/>
      <!-- white mask -->
      <path d="M100 26 C52 26 34 78 38 132 C42 190 66 254 100 258 C134 254 158 190 162 132 C166 78 148 26 100 26 Z" fill="url(#face)"/>
      <!-- eyes -->
      <path d="M58 104 C56 84 72 74 84 82 C94 90 92 120 84 138 C76 154 62 146 60 128 Z" fill="#000"/>
      <path d="M142 104 C144 84 128 74 116 82 C106 90 108 120 116 138 C124 154 138 146 140 128 Z" fill="#000"/>
      <!-- screaming mouth -->
      <path d="M100 172 C82 172 76 196 80 220 C84 244 94 250 100 250 C106 250 116 244 120 220 C124 196 118 172 100 172 Z" fill="#000"/>
    </svg>

    <!-- 1. Incoming call -->
    <section id="screen-ring" class="screen active">
      <p class="caller-label">Incoming call</p>
      <p class="caller-name">Unknown Caller</p>
      <button id="answer" class="answer-btn" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/>
        </svg>
        Answer the Call
      </button>
    </section>

    <!-- 2. On the call: question + form -->
    <section id="screen-call" class="screen">
      <p class="timer" id="timer">00:00</p>
      <h1 class="question" id="question" aria-live="polite"></h1>

      <form id="form" novalidate>
        <label for="movie">Your favorite scary movie</label>
        <input id="movie" name="movie" type="text" required maxlength="200" autocomplete="off" placeholder="e.g. Scream (1996)">

        <label for="name">Your name or room # (optional)</label>
        <input id="name" name="name" type="text" maxlength="100" autocomplete="name">

        <div class="hp" aria-hidden="true">
          <label for="website">Leave this empty</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>

        <button class="submit-btn" id="submit" type="submit">Submit your answer</button>
        <p class="error" id="error" role="alert"></p>
      </form>
    </section>

    <!-- 3. Done -->
    <section id="screen-done" class="screen">
      <h1 class="end-title">Good choice.</h1>
      <p class="end-sub">Your pick has been recorded.<br>See you at movie night&hellip; if you survive. 🔪</p>
    </section>
  </main>

  <script>
    // ================== CONFIG ==================
    // Paste your Google Apps Script Web App URL here (see README.md).
    const SCRIPT_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

    // Optional: path to a recorded voice clip (e.g. "ghostface.mp3").
    // Leave empty to use the browser's built-in text-to-speech voice.
    const VOICE_CLIP = "";

    const LINE = "What's your favorite scary movie?";
    // ============================================

    const $ = (id) => document.getElementById(id);
    const screens = { ring: $("screen-ring"), call: $("screen-call"), done: $("screen-done") };
    let audioCtx, ringTimer, callTimer;

    function show(name) {
      Object.values(screens).forEach((s) => s.classList.remove("active"));
      screens[name].classList.add("active");
      document.body.classList.toggle("ringing", name === "ring");
      document.body.classList.toggle("speaking", name === "call");
    }

    // ---------- Ringtone (synthesized, no audio file needed) ----------
    // Browsers block sound until the user interacts with the page, so the ring
    // starts on the first tap/keypress anywhere and stops when they answer.
    function startRing() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { return; }
      const ringOnce = () => {
        const t = audioCtx.currentTime;
        [0, 0.4].forEach((offset) => {
          const osc1 = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc1.frequency.value = 440;
          osc2.frequency.value = 480;
          gain.gain.setValueAtTime(0, t + offset);
          gain.gain.linearRampToValueAtTime(0.08, t + offset + 0.02);
          gain.gain.setValueAtTime(0.08, t + offset + 0.3);
          gain.gain.linearRampToValueAtTime(0, t + offset + 0.35);
          osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
          osc1.start(t + offset); osc2.start(t + offset);
          osc1.stop(t + offset + 0.36); osc2.stop(t + offset + 0.36);
        });
      };
      ringOnce();
      ringTimer = setInterval(ringOnce, 2500);
    }
    function stopRing() {
      clearInterval(ringTimer);
      if (audioCtx) audioCtx.close().catch(() => {});
    }
    const armRing = (e) => {
      if (e.target.closest && e.target.closest("#answer")) return;
      startRing();
    };
    document.addEventListener("pointerdown", armRing, { once: true });
    document.addEventListener("keydown", armRing, { once: true });

    // ---------- Voice ----------
    function pickCreepyVoice() {
      const voices = speechSynthesis.getVoices().filter((v) => v.lang.startsWith("en"));
      const prefer = ["Daniel", "Fred", "Google UK English Male", "Microsoft David", "Microsoft Guy", "Alex", "Male"];
      for (const name of prefer) {
        const v = voices.find((v) => v.name.includes(name));
        if (v) return v;
      }
      return voices[0] || null;
    }

    function speak(text) {
      return new Promise((resolve) => {
        if (VOICE_CLIP) {
          const audio = new Audio(VOICE_CLIP);
          audio.onended = resolve;
          audio.onerror = resolve;
          audio.play().catch(resolve);
          return;
        }
        if (!("speechSynthesis" in window)) return resolve();
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const voice = pickCreepyVoice();
        if (voice) u.voice = voice;
        u.pitch = 0.1;   // as low as it goes
        u.rate = 0.75;   // slow and menacing
        u.volume = 1;
        u.onend = resolve;
        u.onerror = resolve;
        speechSynthesis.speak(u);
        setTimeout(resolve, 8000); // safety net if onend never fires
      });
    }
    if ("speechSynthesis" in window) {
      speechSynthesis.getVoices();
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }

    // Typewriter effect for the on-screen question
    function typeOut(el, text, ms = 70) {
      el.textContent = "";
      let i = 0;
      return new Promise((resolve) => {
        const tick = setInterval(() => {
          el.textContent += text[i++];
          if (i >= text.length) { clearInterval(tick); resolve(); }
        }, ms);
      });
    }

    function startCallTimer() {
      const start = Date.now();
      callTimer = setInterval(() => {
        const s = Math.floor((Date.now() - start) / 1000);
        $("timer").textContent =
          String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
      }, 1000);
    }

    // ---------- Flow ----------
    $("answer").addEventListener("click", async () => {
      stopRing();
      show("call");
      startCallTimer();
      // speak() must be called directly inside the tap handler for iOS Safari
      const voiceDone = speak(LINE);
      const textDone = typeOut($("question"), LINE);
      await Promise.all([voiceDone, textDone]);
      $("form").classList.add("visible");
      $("movie").focus();
    });

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const movie = $("movie").value.trim();
      const name = $("name").value.trim();
      const error = $("error");
      error.textContent = "";

      if (!movie) {
        error.textContent = "Don't hang up on me. Tell me a movie.";
        $("movie").focus();
        return;
      }
      // Bots fill hidden fields; silently "succeed" without saving.
      if ($("website").value) { finish(); return; }

      const btn = $("submit");
      btn.disabled = true;
      btn.textContent = "Sending…";

      try {
        if (SCRIPT_URL.startsWith("http")) {
          // text/plain + no-cors avoids a CORS preflight, which Apps Script can't answer.
          await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ movie, name }),
          });
        } else {
          console.warn("SCRIPT_URL not set — response not saved:", { movie, name });
        }
        finish();
      } catch (err) {
        error.textContent = "The line went dead. Check your connection and try again.";
        btn.disabled = false;
        btn.textContent = "Submit your answer";
      }
    });

    function finish() {
      clearInterval(callTimer);
      show("done");
    }

    show("ring");
  </script>
</body>
</html>
