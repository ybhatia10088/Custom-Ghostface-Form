<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Incoming Call…</title>
  <meta name="description" content="Halloween movie night: tell us your favorite scary movie.">
  <style>
    :root {
      --paper: #f1ead8;
      --ink: #1b1b1b;
      --blood: #c4001f;
      --muted: #7a7a7a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow-x: hidden;
      font-family: "Courier New", Courier, monospace;
    }

    body {
      background: #000;
      color: #eee;
      transition: background 0.2s;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    .screen.active { display: flex; }

    /* ================= 1. Ringing phone ================= */
    #screen-ring {
      background:
        radial-gradient(ellipse at center, transparent 55%, rgba(80, 60, 30, 0.35) 100%),
        var(--paper);
      color: var(--ink);
    }

    .phone {
      width: min(78vw, 320px);
      height: auto;
      overflow: visible;
    }
    .phone .stroke {
      fill: none;
      stroke: var(--ink);
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .phone .thin { stroke-width: 1.8; }
    .phone .hatch { stroke-width: 1.2; opacity: 0.55; }

    /* Whole phone rattles like a bell is going off inside it */
    .phone-body { animation: rattle 0.12s steps(2) infinite; transform-origin: 160px 230px; }
    /* Handset hops off the cradle */
    .handset { animation: hop 0.24s steps(2) infinite; transform-origin: 160px 95px; }
    /* "Ring" marks flash on and off, GIF style */
    .ring-lines { animation: blink 0.48s steps(1) infinite; }
    .ring-lines.alt { animation-delay: 0.24s; }

    @keyframes rattle {
      0% { transform: translate(-2px, 0) rotate(-1.2deg); }
      100% { transform: translate(2px, 0) rotate(1.2deg); }
    }
    @keyframes hop {
      0% { transform: translateY(0) rotate(-2deg); }
      100% { transform: translateY(-10px) rotate(2deg); }
    }
    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0; }
    }

    .ring-word {
      font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", cursive;
      font-size: clamp(2rem, 10vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.15em;
      margin: 12px 0 28px;
      animation: rattle 0.12s steps(2) infinite;
    }

    .answer-btn {
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--paper);
      background: var(--ink);
      border: 3px solid var(--ink);
      border-radius: 6px;
      padding: 16px 28px;
      cursor: pointer;
      box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.25);
    }
    .answer-btn:hover { background: var(--blood); border-color: var(--blood); }

    .sound-hint {
      margin: 18px 0 0;
      font-size: 0.85rem;
      color: #5a5246;
      visibility: hidden;
    }
    .sound-hint.show { visibility: visible; }

    /* ================= 2. Black screen + answer ================= */
    #screen-call { background: #000; }

    form {
      width: 100%;
      max-width: 420px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.2s ease;
    }
    form.visible { opacity: 1; pointer-events: auto; }

    .prompt {
      color: var(--blood);
      font-size: 0.95rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin: 0 0 14px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 4px;
      font-family: inherit;
      font-size: 1.3rem;
      text-align: center;
      color: #f2f2f2;
      background: transparent;
      border: 0;
      border-bottom: 2px solid #3a3a3a;
      outline: none;
      caret-color: var(--blood);
    }
    input[type="text"]:focus { border-bottom-color: var(--blood); }

    .enter-hint {
      color: #555;
      font-size: 0.8rem;
      margin: 14px 0 0;
    }
    .error { color: var(--blood); font-size: 0.9rem; min-height: 1.2em; margin: 10px 0 0; }

    /* Hidden honeypot field to catch spam bots */
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

    /* ================= 3. Ghostface reveal ================= */
    #screen-reveal { background: #000; }

    .reveal {
      position: relative;
      width: min(100%, 760px);
      overflow: hidden;
      border-radius: 4px;
      animation: emerge 1.4s ease-out both;
    }
    .reveal img {
      display: block;
      width: 100%;
      height: auto;
      animation: creep 12s ease-in-out 1.4s infinite alternate;
    }
    /* Darken the bottom so the caption stays readable over the image */
    .reveal::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 45%, rgba(0, 0, 0, 0.85) 100%);
      pointer-events: none;
    }

    @keyframes emerge {
      0% { opacity: 0; filter: brightness(0); }
      30% { opacity: 1; filter: brightness(1.8); }
      38% { filter: brightness(0.2); }
      46% { filter: brightness(1.4); }
      100% { opacity: 1; filter: brightness(1); }
    }
    /* Slow push-in with an occasional flicker, like old film */
    @keyframes creep {
      0% { transform: scale(1); filter: brightness(1); }
      48% { filter: brightness(1); }
      50% { filter: brightness(0.6); }
      52% { filter: brightness(1.1); }
      100% { transform: scale(1.08); filter: brightness(1); }
    }

    .see-you {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 6%;
      z-index: 1;
      margin: 0;
      padding: 0 16px;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: clamp(1.3rem, 5.5vw, 2.6rem);
      color: #f2f2f2;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
      opacity: 0;
      animation: fadeUp 1.6s ease 1.8s forwards;
    }
    .see-you span { color: var(--blood); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .phone-body, .handset, .ring-word, .reveal, .reveal img { animation: none !important; }
    }
  </style>
</head>
<body>
  <!-- Pencil-sketch filter: wobbles every line so it looks hand drawn.
       The seed flips a few times a second for a "boiling line" GIF feel. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="sketch">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1" result="noise">
        <animate attributeName="seed" values="1;7;3;9" dur="0.48s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
  </svg>

  <!-- ===================== 1. Phone ringing ===================== -->
  <section id="screen-ring" class="screen active">
    <svg class="phone" viewBox="0 0 320 300" filter="url(#sketch)" aria-label="A ringing rotary telephone">
      <!-- ring marks -->
      <g class="ring-lines stroke">
        <path d="M30 70 L8 58"/><path d="M26 100 L2 100"/><path d="M30 130 L8 142"/>
        <path d="M290 70 L312 58"/><path d="M294 100 L318 100"/><path d="M290 130 L312 142"/>
      </g>
      <g class="ring-lines alt stroke">
        <path d="M48 44 L32 26"/><path d="M272 44 L288 26"/>
        <path d="M40 160 L22 176"/><path d="M280 160 L298 176"/>
      </g>

      <g class="phone-body">
        <!-- coiled cord -->
        <path class="stroke thin" d="M58 238 c-14 4 -10 14 -22 16 c-12 2 -8 12 -20 14 c-10 2 -6 12 -14 16"/>

        <!-- base -->
        <path class="stroke" d="M70 130 Q160 110 250 130 L290 262 Q160 282 30 262 Z"/>
        <path class="stroke thin" d="M44 262 Q160 278 276 262"/>
        <!-- cross-hatch shading on the base -->
        <g class="stroke hatch">
          <path d="M48 240 L64 222"/><path d="M52 252 L74 228"/><path d="M62 258 L84 234"/>
          <path d="M272 240 L256 222"/><path d="M268 252 L246 228"/><path d="M258 258 L236 234"/>
        </g>

        <!-- cradle prongs -->
        <path class="stroke" d="M96 128 L92 108 L110 108 L112 124"/>
        <path class="stroke" d="M224 128 L228 108 L210 108 L208 124"/>

        <!-- rotary dial -->
        <circle class="stroke" cx="160" cy="200" r="52"/>
        <circle class="stroke thin" cx="160" cy="200" r="20"/>
        <g class="stroke thin">
          <circle cx="160" cy="164" r="7"/><circle cx="186" cy="174" r="7"/><circle cx="196" cy="200" r="7"/>
          <circle cx="186" cy="226" r="7"/><circle cx="160" cy="236" r="7"/><circle cx="134" cy="226" r="7"/>
          <circle cx="124" cy="200" r="7"/><circle cx="134" cy="174" r="7"/><circle cx="143" cy="167" r="6"/>
        </g>
        <path class="stroke" d="M204 222 L218 232"/>
      </g>

      <!-- handset, jumping on the cradle -->
      <g class="handset">
        <path class="stroke" d="M72 108 Q62 70 92 70 L228 70 Q258 70 248 108 Q244 120 226 116 L210 96 Q160 88 110 96 L94 116 Q76 120 72 108 Z"/>
        <path class="stroke thin" d="M84 104 Q80 86 96 84"/><path class="stroke thin" d="M236 104 Q240 86 224 84"/>
        <g class="stroke hatch">
          <path d="M120 80 L132 74"/><path d="M140 80 L152 74"/><path d="M160 80 L172 74"/><path d="M180 80 L192 74"/>
        </g>
      </g>
    </svg>

    <p class="ring-word" aria-hidden="true">RING! RING!</p>
    <button id="answer" class="answer-btn" type="button">☎ Answer the Call</button>
    <p class="sound-hint" id="sound-hint">Tap anywhere for sound</p>
  </section>

  <!-- ===================== 2. Black screen ===================== -->
  <section id="screen-call" class="screen">
    <form id="form" novalidate autocomplete="off">
      <p class="prompt">Your favorite scary movie</p>
      <label for="movie" class="hp">Movie name</label>
      <input id="movie" name="movie" type="text" required maxlength="200" aria-label="Your favorite scary movie">
      <div class="hp" aria-hidden="true">
        <label for="website">Leave this empty</label>
        <input id="website" name="website" type="text" tabindex="-1">
      </div>
      <!-- Hidden submit button so Enter (and the phone keyboard's "Go") submits -->
      <button type="submit" class="hp" tabindex="-1" aria-hidden="true">Submit</button>
      <p class="enter-hint">Press Enter to answer</p>
      <p class="error" id="error" role="alert"></p>
    </form>
  </section>

  <!-- ===================== 3. Ghostface reveal ===================== -->
  <section id="screen-reveal" class="screen">
    <div class="reveal">
      <!-- Swap in an animated GIF here (e.g. images/ghostface.gif) if you have one -->
      <img src="images/ghostface.webp" alt="Ghostface in the dark" width="760" height="340">
      <p class="see-you">See you at the movies<span>…</span></p>
    </div>
  </section>

  <!-- Audio: the ring is an original vintage bell ringtone, the voice a
       supplied voice clip. See README.md to swap in your own. -->
  <audio id="ring" src="audio/ring.mp3" loop preload="auto"></audio>
  <audio id="voice" src="audio/voice.mp3" preload="auto"></audio>

  <script>
    // ================== CONFIG ==================
    // Paste your Google Apps Script Web App URL here (see README.md).
    const SCRIPT_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";
    // ============================================

    const $ = (id) => document.getElementById(id);
    // Some viewers (embedded previews, strict security settings) refuse to
    // load <audio>. If that happens, decode the same file with the Web Audio
    // API instead, which isn't blocked the same way.
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let ctx = null;

    function makeSound(el) {
      const sound = { buffer: null, source: null, onended: null };
      el.addEventListener("ended", () => sound.onended && sound.onended());

      async function useFallback() {
        if (!AudioCtx || sound.buffer) return;
        try {
          ctx = ctx || new AudioCtx();
          const src = el.getAttribute("src");
          const bytes = src.startsWith("data:")
            ? Uint8Array.from(atob(src.slice(src.indexOf(",") + 1)), (c) => c.charCodeAt(0)).buffer
            : await (await fetch(src)).arrayBuffer();
          sound.buffer = await ctx.decodeAudioData(bytes);
        } catch (err) {
          console.warn("Audio could not be loaded:", el.id, err);
        }
      }
      // The error may already have happened before this script ran.
      if (el.error) useFallback();
      else el.addEventListener("error", useFallback);

      sound.play = () => {
        if (!sound.buffer) {
          el.currentTime = 0;
          return el.play();
        }
        sound.stop();
        const source = ctx.createBufferSource();
        source.buffer = sound.buffer;
        source.loop = el.loop;
        source.connect(ctx.destination);
        source.onended = () => sound.onended && sound.onended();
        sound.source = source;
        // resume() must be called from the tap itself to unlock sound.
        const unlocked = ctx.resume().then(() => source.start());
        const timeout = new Promise((_, reject) =>
          setTimeout(() => reject(new Error("Sound is locked until the page is tapped")), 1500));
        return Promise.race([unlocked, timeout]);
      };

      sound.stop = () => {
        el.pause();
        el.currentTime = 0;
        if (sound.source) {
          sound.source.onended = null;
          try { sound.source.stop(); } catch (e) { /* never started */ }
          sound.source = null;
        }
      };
      return sound;
    }

    const ring = makeSound($("ring"));
    const voice = makeSound($("voice"));
    let answered = false;

    function show(id) {
      document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
      $(id).classList.add("active");
    }

    // ---------- Ringing on page load ----------
    // Browsers usually block sound until the visitor taps the page. Try to ring
    // right away; if blocked, start ringing on the first tap anywhere.
    let ringing = false;
    function startRing() {
      if (answered || ringing) return Promise.resolve();
      ringing = true; // set now so a tap's touchend + click don't double-ring
      return ring.play().then(
        () => $("sound-hint").classList.remove("show"),
        (err) => { ringing = false; throw err; });
    }
    startRing().catch(() => {
      $("sound-hint").classList.add("show");
      const unlock = (e) => {
        if (e.target.closest && e.target.closest("#answer")) return;
        startRing().catch(() => {});
      };
      // Only click/touchend/keydown count as a "user gesture" on iPhones;
      // pointerdown/touchstart do not.
      ["click", "touchend", "keydown"].forEach((type) =>
        document.addEventListener(type, unlock, { once: true }));
    });

    // ---------- Answer the call ----------
    $("answer").addEventListener("click", () => {
      answered = true;
      ring.stop();
      show("screen-call");

      const revealForm = () => {
        $("form").classList.add("visible");
        $("movie").focus();
      };
      // play() must run right here in the tap handler, or iPhones block it.
      // The pause on the line before the voice is baked into voice.mp3.
      voice.onended = revealForm;
      voice.play().catch((err) => {
        console.warn("Voice could not play:", err);
        revealForm();
      });
      // Safety net in case the audio never fires "ended".
      setTimeout(revealForm, 9000);
    });

    // ---------- Submit with Enter ----------
    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const movie = $("movie").value.trim();
      $("error").textContent = "";

      if (!movie) {
        $("error").textContent = "Don't hang up on me. Name a movie.";
        return;
      }
      $("movie").disabled = true;

      // Bots fill the hidden field; skip saving but play along.
      if (!$("website").value && SCRIPT_URL.startsWith("http")) {
        try {
          // text/plain + no-cors avoids a CORS preflight, which Apps Script can't answer.
          await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ movie }),
          });
        } catch (err) {
          $("movie").disabled = false;
          $("error").textContent = "The line went dead. Check your connection and press Enter again.";
          return;
        }
      } else if (!SCRIPT_URL.startsWith("http")) {
        console.warn("SCRIPT_URL not set — response not saved:", movie);
      }

      voice.stop();
      show("screen-reveal");
    });
  </script>
</body>
</html>
